      { allow: groups, provider: userPools, groups: ["Admin"] }
      { allow: owner, provider: userPools, operations: [create, read, update] }
      { allow: private, provider: userPools, operations: [read, update] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  owner: ID!
  eventId: ID!
  userId: ID
  email: String
  subject: String
