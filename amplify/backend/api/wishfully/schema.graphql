type User
  @model(
    timestamps: { createdAt: "createdOn", updatedAt: "updatedOn" }
    subscriptions: null
    queries: { get: "getUser" }
  )
  @auth(
    rules: [
      { allow: groups, provider: userPools, groups: ["Admin"] }
      { allow: owner, provider: userPools, operations: [create, update, read] }
      { allow: private, provider: userPools, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  firstName: String!
  lastName: String!
  uniqueId: String
  statusMessage: String
  version: Int
  userDetails: UserDetails @connection(fields: ["id"])
}

type UserDetails
  @model(
    timestamps: { createdAt: "createdOn", updatedAt: "updatedOn" }
    subscriptions: null
    queries: { get: "getUserDetails" }
  )
  # @key(name: "UserByEmail", fields: ["email"], queryField: "userByEmail")
  @auth(
    rules: [
      { allow: groups, provider: userPools, groups: ["Admin"] }
      {
        allow: owner
        provider: userPools
        operations: [create, update, delete, read]
      }
      { allow: private, provider: userPools, operations: [read] }
    ]
  ) {
  id: ID!
  currentTheme: String!
  dateOfBirth: AWSDateTime
  email: String!
  phone: AWSPhone
  dateJoined: AWSDateTime
  twoFactorMode: String
  version: Int
  user: User @connection(fields: ["id"])
  groups: [String]
  events: [String]
}

