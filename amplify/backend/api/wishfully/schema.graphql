type Event
  @model(
    timestamps: { createdAt: "createdOn", updatedAt: "updatedOn" }
    subscriptions: null
  )
  @auth(
    rules: [
      { allow: groups, provider: userPools, groups: ["Admin"] }
      { allow: owner, provider: userPools, operations: [create, update, read] }
      { allow: private, provider: userPools, operations: [read] }
      { allow: public, operations: [read] }
    ]
  ) {
  id: ID!
  owner: ID!
  name: String!
  details: String
  publicID: String!
  needApproval: Boolean
  eventType: EventType
  eventUserId: ID
  eventDate: AWSDateTime
  isPrivate: Boolean
  isGroup: Boolean
  isPublic: Boolean
  groupId: ID
  wishlistId: ID!
  version: Int
  isArchived: Boolean
  wishlist: Wishlist @connection(fields: ["wishlistId"])
  invites: [EventInvite] @connection(keyName: "InvitesByEvent", fields: ["id"])
  users: [EventUser] @connection(keyName: "UsersByEvent", fields: ["id"])
}

enum EventType {
  birthday
  event
  wedding
  anniversary
  housewarming
}

type EventInvite
  @model(
    timestamps: { createdAt: "createdOn", updatedAt: "updatedOn" }
    subscriptions: null
  )
  @key(
    name: "InvitesByEvent"
    fields: ["eventId"]
    queryField: "invitesByEvent"
  )
  @key(
    name: "EventInvitesByUser"
    fields: ["owner"]
    queryField: "eventInvitesByUser"
  )
  @auth(
